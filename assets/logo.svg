<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="240" height="240" rx="36" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="236" height="236" rx="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Central DAG Engine Symbol -->
  <!-- Pipeline Nodes & Connecting Edges -->
  <path d="M 50 120 L 85 70 L 155 70 L 190 120 L 155 170 L 85 170 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="6,3" opacity="0.6" />
  
  <!-- Central Document Shield -->
  <path d="M 90 60 L 150 60 L 165 75 L 165 170 L 90 170 Z" fill="#1E293B" stroke="url(#primaryGrad)" stroke-width="3.5" rx="4" />
  <path d="M 150 60 L 150 75 L 165 75 Z" fill="#06B6D4" opacity="0.8" />
  
  <!-- Document Content Lines -->
  <line x1="105" y1="95" x2="150" y2="95" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" />
  <line x1="105" y1="115" x2="145" y2="115" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="105" y1="135" x2="135" y2="135" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="105" y1="152" x2="125" y2="152" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />

  <!-- DAG Flow Orbit Nodes -->
  <circle cx="50" cy="120" r="7" fill="#4F46E5" filter="url(#glow)" />
  <circle cx="85" cy="70" r="6" fill="#06B6D4" filter="url(#glow)" />
  <circle cx="155" cy="70" r="6" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="190" cy="120" r="7" fill="#10B981" filter="url(#glow)" />
  <circle cx="155" cy="170" r="6" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="85" cy="170" r="6" fill="#EC4899" filter="url(#glow)" />

  <!-- Stage Connecting Flow Arrows -->
  <path d="M 57 120 L 78 78" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
  <path d="M 92 70 L 148 70" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  <path d="M 162 76 L 183 115" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <path d="M 183 125 L 162 164" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <path d="M 148 170 L 92 170" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
</svg>
